<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Skill Quest 2026 | Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="brand-section">

            <div class="logo-placeholder"><img src="{{ url_for('static', filename='images/skillquest-logo.png') }}" alt="Skill Quest 2026 Logo"></div>

            <h1>Skill Quest 2026</h1>

            <p>Educadd Online Examination System</p>

        </div>


        <div class="login-section">

            <h2>Welcome Back</h2>

            <p class="login-subtitle">
                Login to continue
            </p>

            {% with messages = get_flashed_messages(
                with_categories=true
            ) %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}


            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn login-button w-100">

                    LOGIN

                </button>

            </form>

        </div>

        <div class="login-footer">

            <p>
                © 2026 Educadd | Skill Quest 2026
            </p>

        </div>

    </div>

</div>

</body>

</html>
