<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Time Expired | Skill Quest 2026
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="student-body">


<header class="student-header">

    <div class="student-brand">

        <div class="student-logo"><img src="{{ url_for('static', filename='images/skillquest-logo.png') }}" alt="Skill Quest 2026 Logo"></div>

        <div>

            <h4>
                Skill Quest 2026
            </h4>

            <span>
                Educadd Online Examination System
            </span>

        </div>

    </div>

</header>


<main class="status-container">


    <div class="status-card">


        <div class="status-icon">
            ⏱
        </div>


        <h1>
            Time Expired
        </h1>


        <p>
            Your 30-minute examination time
            has ended.
        </p>


        <p>
            Your responses have been recorded.
        </p>


        <div class="status-message">

            Your examination has been submitted
            automatically.

        </div>


        <h3>
            Thank You
        </h3>


        <p>
            Thank you for participating in
            Skill Quest 2026.
        </p>


    </div>


</main>


</body>

</html>
